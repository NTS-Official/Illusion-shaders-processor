[package]
name = "Illusion-shaders-extension"
version = "0.0.1"
edition = "2024"

[dependencies]
naga = { path = "../naga-for-hlsl/naga", features = ["glsl-in", "hlsl-out"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[[bin]]
name = "shader-convert"
path = "src/bin/shader-convert.rs"
